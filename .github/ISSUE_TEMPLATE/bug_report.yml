name: Bug report
description: Something does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not paste session transcripts, prompts, file paths or other
        personal data; replace them with made-up examples. Report security problems privately,
        as described in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Session Atlas version
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      placeholder: "1.8.10"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "14.6"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: python3 path and version
      description: Shown in Settings → Session Atlas → Installation check.
      placeholder: "/usr/bin/python3 · 3.9"
  - type: input
    id: agent-versions
    attributes:
      label: Claude Code and Codex versions
      description: Output of `claude --version` and, if relevant, `codex --version`.
  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: >-
        Relevant lines from ~/Library/Application Support/session-atlas/server.log and the
        Obsidian developer console (View → Toggle Developer Tools). Remove personal data first.
      render: text
